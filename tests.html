<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trampantojo · pruebas</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; background: #fcfcfb; color: #0b0b0b; }
    h1 { font-size: 20px; }
    li { margin: 2px 0; }
    .ok { color: #006300; }
    .ko { color: #b42323; font-weight: 600; }
    #sum { font-weight: 700; font-size: 17px; }
  </style>
</head>
<body>
  <h1>Pruebas de los cálculos</h1>
  <p id="sum">Ejecutando…</p>
  <ul id="out"></ul>
  <script type="module">
    import * as C from './js/calc.js?v=0.7.0';
    import * as S from './js/store.js?v=0.7.0';
    import { messageOfTheDay } from './js/messages.js?v=0.7.0';
    import * as FO from './js/foods.js?v=0.7.0';
    import * as AN from './js/antojo.js?v=0.7.0';
    import * as ID from './js/ideas.js?v=0.7.0';
    import * as LG from './js/logros.js?v=0.7.0';

    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    const near = (a, b, tol = 0.01) => Math.abs(a - b) <= tol;
    function check(name, cond, detail = '') {
      const li = document.createElement('li');
      li.className = cond ? 'ok' : 'ko';
      li.textContent = (cond ? '✓ ' : '✗ ') + name + (cond ? '' : '  → ' + detail);
      out.appendChild(li);
      cond ? pass++ : fail++;
    }
    const days = (from, n, f) => Array.from({ length: n }, (_, i) => ({ date: C.addDays(from, i), kg: f(i) }));

    // fechas
    check('días entre fechas cruzando el cambio de hora de marzo', C.daysBetween('2026-03-28', '2026-03-30') === 2);
    check('días entre fechas cruzando el cambio de hora de octubre', C.daysBetween('2026-10-24', '2026-10-26') === 2);
    check('sumar días pasa de mes', C.addDays('2026-02-27', 2) === '2026-03-01');
    check('sumar días en año bisiesto', C.addDays('2024-02-28', 1) === '2024-02-29');
    check('edad la víspera del cumpleaños', C.ageOn('1980-09-23', '2026-09-22') === 45);
    check('edad el día del cumpleaños', C.ageOn('1980-09-22', '2026-09-22') === 46);

    // composición
    check('IMC 90 kg, 180 cm = 27,78', near(C.bmi(90, 180), 27.78));
    check('IMC 24,9 es peso normal', C.bmiZone(24.9).key === 'normal');
    check('IMC 25 es sobrepeso', C.bmiZone(25).key === 'sobrepeso');
    check('IMC 18,4 es bajo peso', C.bmiZone(18.4).key === 'bajo');
    check('IMC 40 es obesidad III', C.bmiZone(40).key === 'ob3');
    const hr = C.healthyRange(180);
    check('peso saludable 180 cm ≈ 59,9–80,7', near(hr[0], 59.94) && near(hr[1], 80.68), hr.join(' – '));
    check('cintura/altura 0,49 saludable', C.whtrZone(0.49).status === 'good');
    check('cintura/altura 0,55 riesgo aumentado', C.whtrZone(0.55).status === 'warning');
    const bf = C.navyBodyFat({ sex: 'h', cm: 178, waist: 90, neck: 38 });
    check('grasa (Marina) hombre 178/90/38 ≈ 20,2 %', near(bf, 20.2, 0.2), bf);
    check('grasa mujer sin cadera = sin dato', C.navyBodyFat({ sex: 'm', cm: 165, waist: 80, neck: 33 }) === null);

    // energía
    check('basal hombre 90 kg 180 cm 45 años = 1805', near(C.bmr({ sex: 'h', kg: 90, cm: 180, age: 45 }), 1805));
    check('basal mujer 70 kg 165 cm 30 años = 1420,25', near(C.bmr({ sex: 'm', kg: 70, cm: 165, age: 30 }), 1420.25));
    check('gasto moderado = basal × 1,55', near(C.tdee(1805, 'moderado'), 2797.75));
    const t1 = C.targetKcal({ tdee: 2800, rateKgWeek: 0.5, sex: 'h' });
    check('objetivo 0,5 kg/sem = 550 kcal menos', near(t1.kcal, 2250) && !t1.clipped, JSON.stringify(t1));
    const t2 = C.targetKcal({ tdee: 1800, rateKgWeek: 1, sex: 'm' });
    check('objetivo nunca baja del mínimo (1200 mujer)', t2.kcal === 1200 && t2.clipped && near(t2.effectiveRate, 0.545, 0.001), JSON.stringify(t2));
    check('en la meta: objetivo = gasto', C.targetKcal({ tdee: 2500, rateKgWeek: 0.5, sex: 'h', maintain: true }).kcal === 2500);

    // tendencia
    const d = C.dailySeries([{ date: '2026-09-01', kg: 100 }, { date: '2026-09-03', kg: 98 }]);
    check('serie diaria rellena el hueco', d.length === 3 && d[1].kg === null && d[1].measured === false);
    check('la tendencia usa el día rellenado (99,71)', near(d[2].trend, 99.71), d.map(x => x.trend).join(', '));
    const lin = days('2026-08-01', 22, i => 100 - 0.1 * i);
    const linD = C.dailySeries(days('2026-06-01', 90, i => 100 - 0.07 * i));
    const lag = linD[linD.length - 1].trend - linD[linD.length - 1].kg;
    check('la tendencia no se queda atrás en una bajada constante (< 0,1 kg)', Math.abs(lag) < 0.1, lag.toFixed(3));
    const r = C.rateKgPerWeek(lin, lin[lin.length - 1].date);
    check('ritmo de una bajada de 0,1 kg/día = −0,7 kg/sem', r && near(r.perWeek, -0.7, 0.001), JSON.stringify(r));
    check('ritmo con 3 pesadas = sin dato', C.rateKgPerWeek(lin.slice(-3), lin[lin.length - 1].date) === null);
    check('ritmo con menos de una semana = sin dato', C.rateKgPerWeek(lin.slice(-6), lin[lin.length - 1].date) === null);

    // proyección
    const p1 = C.projectGoal({ trendKg: 90, goalKg: 80, perWeek: -0.5, fromDate: '2026-09-22' });
    check('10 kg a 0,5 kg/sem = 140 días', p1.status === 'ok' && p1.days === 140 && p1.date === C.addDays('2026-09-22', 140), JSON.stringify(p1));
    check('en la meta = conseguido', C.projectGoal({ trendKg: 80.2, goalKg: 80, perWeek: -0.5, fromDate: '2026-09-22' }).status === 'conseguido');
    check('sin bajar = estancado', C.projectGoal({ trendKg: 90, goalKg: 80, perWeek: -0.01, fromDate: '2026-09-22' }).status === 'estancado');
    check('más de 2 años = lejos', C.projectGoal({ trendKg: 100, goalKg: 80, perWeek: -0.1, fromDate: '2026-09-22' }).status === 'lejos');
    check('sin ritmo = sin datos', C.projectGoal({ trendKg: 90, goalKg: 80, perWeek: null, fromDate: '2026-09-22' }).status === 'sin-datos');

    // plan y objetivos
    const plan = { startDate: '2026-09-01', startKg: 100 };
    check('plan: a 0,5 kg/sem, 14 días después toca 99', near(C.planKgAt(plan, 0.5, 80, '2026-09-15'), 99));
    check('plan: nunca baja de la meta', C.planKgAt(plan, 1, 99, '2026-12-01') === 99);
    check('plan: antes de empezar no hay plan', C.planKgAt(plan, 0.5, 80, '2026-08-30') === null);
    check('plan: pasa por 95 kg a las 10 semanas', C.planDateForKg(plan, 0.5, 95) === C.addDays('2026-09-01', 70));
    check('ritmo del plan: 0,6 kg mejor = por delante', C.paceStatus(98.4, 99).status === 'ahead');
    check('ritmo del plan: 0,3 kg arriba = en el carril', C.paceStatus(99.3, 99).status === 'on');
    check('ritmo del plan: 0,8 kg arriba = por detrás', C.paceStatus(99.8, 99).status === 'behind');
    const sm = { today: '2026-10-01', trendKg: 96, rate: { perWeek: -0.5 },
      daily: [{ date: '2026-09-20', trend: 97 }, { date: '2026-10-01', trend: 96 }] };
    check('objetivo ya tocado = conseguido', C.milestoneStatus({ date: '2026-12-01', kg: 97 }, sm).status === 'conseguido');
    check('objetivo a tiempo al ritmo real = en camino', C.milestoneStatus({ date: '2026-11-26', kg: 92 }, sm).status === 'en-camino');
    const tight = C.milestoneStatus({ date: '2026-10-29', kg: 92 }, sm);
    check('objetivo demasiado cerca = detrás (y dice cuánto hace falta)', tight.status === 'detras' && near(tight.needed, 1, 0.01), JSON.stringify(tight));
    check('objetivo con la fecha pasada sin tocarlo = pasado', C.milestoneStatus({ date: '2026-09-25', kg: 95 }, sm).status === 'pasado');

    // la meta con fecha
    check('ritmo para una fecha: 10 kg en 140 días = 0,5 kg/sem', near(C.rateForDate('2026-09-23', 80, 70, C.addDays('2026-09-23', 140)), 0.5, 0.001));
    check('ritmo para una fecha pasada = sin dato', C.rateForDate('2026-09-23', 80, 70, '2026-09-01') === null);
    check('fecha para un ritmo: 10 kg a 0,5 kg/sem = 140 días', C.dateForRate('2026-09-23', 80, 70, 0.5) === C.addDays('2026-09-23', 140));
    const sd = C.summarize({ ...S.emptyState(), profile: { name: 'X', sex: 'h', birthDate: '1980-01-01', heightCm: 175, goalKg: 70, goalDate: C.addDays('2026-09-01', 140), rateKgWeek: 0.25, activity: 'ligero', plan: { startDate: '2026-09-01', startKg: 80 } }, weights: [{ date: '2026-09-01', kg: 80 }] }, '2026-09-01');
    check('con fecha de meta, el ritmo del plan sale de la fecha (no del guardado)', near(sd.rateKgWeek, 0.5, 0.001), sd.rateKgWeek);
    const mig = S.migrate({ profile: { goalKg: 70, rateKgWeek: 0.5, plan: { startDate: '2026-09-01', startKg: 80 } }, weights: [{ date: '2026-09-01', kg: 80 }] });
    check('los datos viejos ganan una fecha de meta al migrar', mig.profile.goalDate === C.addDays('2026-09-01', 140), mig.profile.goalDate);

    // la tabla de alimentos y las frases
    check('buscar «huevos» da el huevo', FO.searchFoods('huevos')[0]?.id === 'huevo', FO.searchFoods('huevos')[0]?.id);
    check('buscar «lentejas» da las lentejas', FO.searchFoods('lentejas')[0]?.id === 'lentejas', FO.searchFoods('lentejas')[0]?.id);
    check('buscar sin tildes («platano») encuentra el plátano', FO.searchFoods('platano')[0]?.id === 'platano');
    check('buscar por alias («nocilla») encuentra la crema de cacao', FO.searchFoods('nocilla')[0]?.id === 'crema-cacao');
    const ph = FO.parsePhrase('2 huevos y una tostada');
    check('frase: «2 huevos y una tostada» son dos cosas', ph.items.length === 2 && ph.understood === 2);
    check('frase: 2 huevos = 110 g de huevo', ph.items[0]?.item.id === 'huevo' && ph.items[0].qty === 2 && ph.items[0].grams === 110, JSON.stringify(ph.items[0]));
    check('frase: una tostada = una rebanada de pan', ph.items[1]?.item.id === 'pan-blanco' && ph.items[1].unit === 'rebanada' && ph.items[1].grams === 30, JSON.stringify(ph.items[1]));
    const g150 = FO.parsePart('150 g de arroz');
    check('frase: «150 g de arroz» = 150 g', g150?.item.id === 'arroz-cocido' && g150.unit === 'g' && g150.grams === 150, JSON.stringify(g150));
    const tc = FO.parsePhrase('una tostada con aceite');
    check('frase: «una tostada con aceite» = pan + aceite', tc.understood === 2 && tc.items[0]?.item.id === 'pan-blanco' && tc.items[1]?.item.id === 'aceite', JSON.stringify(tc.items.map(x => x?.item.id)));
    check('quitar cantidad: «2 platos de lentejas» → «lentejas»', FO.stripQty('2 platos de lentejas') === 'lentejas');
    check('frase: «un café con leche» no se parte por el «con»', FO.parsePhrase('un café con leche').items[0]?.item.id === 'cafe-leche');
    const canas = FO.parsePart('2 cañas');
    check('frase: «2 cañas» = dos cañas de cerveza', canas?.item.id === 'cerveza' && canas.unit === 'caña' && canas.grams === 400, JSON.stringify(canas));
    const plato = FO.parsePart('un plato de lentejas con chorizo');
    check('frase: «un plato de lentejas con chorizo» = 300 g del guiso', plato?.item.id === 'lentejas-chorizo' && plato.grams === 300, JSON.stringify(plato));
    check('nutrientes: 200 g de arroz = 260 kcal', near(FO.nutrientsFor(FO.FOODS_BY_ID.get('arroz-cocido'), 200).kcal, 260));
    check('todas las raciones de la tabla tienen gramos', FO.FOODS.every(f => f.u.length && f.u.every(([n, g]) => n && g > 0)));
    check('todos los alimentos tienen calorías coherentes con sus nutrientes (±25 %)',
      FO.FOODS.filter(f => f.k > 30).every(f => { const est = f.p * 4 + f.c * 4 + f.f * 9; return Math.abs(est - f.k) / f.k < 0.25 || f.id.match(/cerveza|vino|licor|cubata|vermut|tinto/); }),
      FO.FOODS.filter(f => f.k > 30 && !f.id.match(/cerveza|vino|licor|cubata|vermut|tinto/)).filter(f => Math.abs(f.p * 4 + f.c * 4 + f.f * 9 - f.k) / f.k >= 0.25).map(f => f.id).join(', '));

    // el gasto medido
    const flat = C.dailySeries(days('2026-08-01', 28, () => 90));
    const food20 = {}; for (let i = 0; i < 20; i++) food20[C.addDays('2026-08-01', i)] = [{ kcal: 2000 }];
    const md = C.measuredTdee(food20, flat, '2026-08-28');
    check('gasto medido: peso estable comiendo 2000 = 2000', md && near(md.tdee, 2000, 1), JSON.stringify(md));
    const food10 = {}; for (let i = 0; i < 10; i++) food10[C.addDays('2026-08-01', i)] = [{ kcal: 2000 }];
    check('gasto medido: con menos de 14 días apuntados = sin dato', C.measuredTdee(food10, flat, '2026-08-28') === null);
    const lose = C.dailySeries(days('2026-06-01', 88, i => 95 - i * 0.05));
    const foodL = {}; for (let i = 60; i < 88; i++) foodL[C.addDays('2026-06-01', i)] = [{ kcal: 2000 }];
    const ml = C.measuredTdee(foodL, lose, C.addDays('2026-06-01', 87));
    check('gasto medido: bajando 0,35 kg/sem comiendo 2000 ≈ 2385', ml && Math.abs(ml.tdee - 2385) < 40, JSON.stringify(ml));

    // el antojo
    const base = { hour: 18, weekday: 2, hunger: 3, mood: 'bien', sleep: 8, craving: AN.CRAVINGS[1], eatenKcal: 1500, proteinG: 90, logged: true, hoursSinceMeal: 1, target: 2000, proteinTarget: 100, daysTracked: 30, sameHourCount: 0, stalled: false };
    const ant1 = AN.explain({ ...base, hunger: 9, hoursSinceMeal: 5 });
    check('antojo: mucha hambre y 5 h sin comer = hambre de verdad', ant1[0].title === 'Es hambre de verdad', ant1.map(r => r.title).join(' · '));
    const ant2 = AN.explain({ ...base, mood: 'aburrido', hunger: 1 });
    check('antojo: poca hambre y aburrido = aburrimiento', ant2[0].title === 'Es aburrimiento, no estómago', ant2.map(r => r.title).join(' · '));
    const ant3 = AN.explain({ ...base, sleep: 5, mood: 'estres' });
    check('antojo: estrés y poco sueño salen los dos', ant3.some(r => /estrés/.test(r.title)) && ant3.some(r => /dormido/.test(r.title)), ant3.map(r => r.title).join(' · '));
    const ant4 = AN.explain({ ...base, logged: true, eatenKcal: 300, hour: 20, hunger: 5 });
    check('antojo: comer muy poco de día se dice', ant4.some(r => /muy poco/.test(r.title)), ant4.map(r => r.title).join(' · '));
    check('antojo: siempre explica algo (la ola)', AN.explain({ ...base, logged: false }).length >= 1);
    const c1 = AN.cost({ kcal: 300, weightKg: 90, remaining: 600, target: 2000 });
    check('antojo: 300 kcal = el 50 % de lo que queda', c1.pctRemaining === 50);
    check('antojo: 300 kcal a diario ≈ 14,2 kg al año', near(c1.kgYearIfDaily, 14.2, 0.1));
    check('antojo: con alergia a la lactosa no propone yogur', AN.alternatives('dulce', 3, { allergies: 'lactosa' }).every(a => !/yogur/i.test(a.label)));
    check('antojo: con mucha hambre propone comida de verdad primero', AN.alternatives('dulce', 9, {})[0].label.startsWith('Una tortilla'));
    // el análisis a largo plazo: días con desayuno pobre y más antojos
    const foodA = {}, crA = [];
    for (let i = 0; i < 20; i++) {
      const d = C.addDays('2026-09-01', i);
      const poor = i % 2 === 0;
      foodA[d] = [{ meal: 'desayuno', kcal: poor ? 100 : 450, p: 5, t: new Date(d + 'T08:00').getTime() }, { meal: 'comida', kcal: 1200, p: 60, t: new Date(d + 'T14:00').getTime() }];
      const n = poor ? 2 : 0;
      for (let k = 0; k < n; k++) crA.push({ id: d + k, date: d, hour: 18, weekday: new Date(d).getDay(), t: new Date(d + 'T18:00').getTime(), mood: 'aburrido', sleep: 8, outcome: 'resistido' });
    }
    const an = AN.analyzeCravings(crA, foodA, '2026-09-20', 100);
    check('análisis: ve que desayunar poco da más antojos', an.insights.some(i => /desayuno/.test(i.title)), JSON.stringify(an.insights.map(i => i.title)));
    check('análisis: ve que el aburrimiento es tu disparador', an.insights.some(i => /detrás/.test(i.title)));
    check('análisis: con menos de 5 antojos no se inventa nada', AN.analyzeCravings(crA.slice(0, 3), foodA, '2026-09-20', 100).need === 2);

    // ideas de comida
    check('ideas: a las 21 h toca la cena', ID.nextMeal(21) === 'cena');
    check('ideas: a las 8 h toca el desayuno', ID.nextMeal(8) === 'desayuno');
    const sg = ID.suggest({ hour: 21, remainingKcal: 500, proteinGap: 40, dayKcalTarget: 2000, avoidText: '' });
    check('ideas: propone tres cenas', sg.items.length === 3 && sg.items.every(x => x.idea.meal === 'cena'));
    check('ideas: no se pasan de lo que queda', sg.items.every(x => x.n.kcal <= 580), sg.items.map(x => Math.round(x.n.kcal)).join(', '));
    const sgNoEgg = ID.suggest({ hour: 21, remainingKcal: 600, proteinGap: 0, dayKcalTarget: 2000, avoidText: 'huevo' });
    check('ideas: con alergia al huevo, ni una idea con huevo', sgNoEgg.items.every(x => !x.idea.tags.includes('huevo')));
    const sgDislike = ID.suggest({ hour: 14, remainingKcal: 900, proteinGap: 0, dayKcalTarget: 2200, avoidText: 'no me gusta el salmon ni las lentejas' });
    check('ideas: lo que no te gusta no sale', sgDislike.items.every(x => !/salm|lentejas/i.test(x.idea.name)), sgDislike.items.map(x => x.idea.name).join(' · '));
    check('ideas: todas usan alimentos que existen en la tabla', ID.IDEAS.every(i => i.items.every(([id, unit]) => FO.FOODS_BY_ID.get(id)?.u.some(([n]) => n === unit))),
      ID.IDEAS.flatMap(i => i.items.filter(([id, unit]) => !FO.FOODS_BY_ID.get(id)?.u.some(([n]) => n === unit)).map(([id, unit]) => `${i.id}:${id}/${unit}`)).join(', '));

    // logros, agua y semana
    check('racha más larga con huecos = 3', LG.longestStreak(['2026-09-01', '2026-09-02', '2026-09-04', '2026-09-05', '2026-09-06']) === 3);
    check('agua: 8 vasos para hombre, 7 para mujer', LG.waterGoal('h') === 8 && LG.waterGoal('m') === 7);
    const profB = { name: 'B', sex: 'h', birthDate: '1980-01-01', heightCm: 178, goalKg: 80, rateKgWeek: 0.5, activity: 'ligero' };
    const stB = { ...S.emptyState(), profile: profB, weights: days('2026-08-01', 10, i => 95 - i * 0.3), cravings: [{ id: 'x', date: '2026-08-05', hour: 18, outcome: 'resistido' }], meta: {} };
    const sB = C.summarize(stB, '2026-08-10');
    const evB = LG.evaluateBadges(stB, sB, '2026-08-10');
    const ids = evB.earned.map(e => e.badge.id);
    check('logros: primer paso, una semana, primer kilo y primera ola', ['primer-paso', 'semana', 'kilo', 'antojo'].every(i => ids.includes(i)), ids.join(', '));
    check('logros: sin 30 días no hay «un mes»', !ids.includes('mes'));
    const evB2 = LG.evaluateBadges({ ...stB, meta: { badges: evB.stored } }, sB, '2026-08-11');
    check('logros: lo ya conseguido no se felicita dos veces', evB2.fresh.length === 0 && evB2.earned.find(e => e.badge.id === 'kilo').date === '2026-08-10');
    const wk2 = LG.weekSummary({ ...stB, water: { '2026-08-10': 8, '2026-08-09': 6 } }, sB.daily, '2026-08-10', 'h');
    check('semana: tendencia bajando y agua media', wk2.change < 0 && near(wk2.cur.avgWater, 2, 0.01), JSON.stringify({ c: wk2.change, w: wk2.cur.avgWater }));

    // semanas y racha
    const wk = C.weeklyChanges(C.dailySeries(days('2026-07-01', 60, i => 100 - 0.1 * i)));
    check('cambios semanales: 8 semanas, todas bajando', wk.length === 8 && wk.every(w => w.change < 0), JSON.stringify(wk.map(w => w.change.toFixed(2))));
    const e3 = [{ date: '2026-09-20', kg: 1 }, { date: '2026-09-21', kg: 1 }, { date: '2026-09-22', kg: 1 }];
    check('racha de 3 días', C.streak(e3, '2026-09-22') === 3);
    check('racha cuenta hasta ayer si hoy no toca aún', C.streak(e3.slice(0, 2), '2026-09-22') === 2);
    check('racha se corta en un hueco', C.streak([{ date: '2026-09-18', kg: 1 }, ...e3.slice(1)], '2026-09-22') === 2);

    // hábitos
    check('4 días × 45 min = moderada', C.suggestActivity({ exerciseDays: 4, exerciseMinutes: 45 }) === 'moderado');
    check('… y con trabajo físico = alta', C.suggestActivity({ exerciseDays: 4, exerciseMinutes: 45, work: 'movimiento' }) === 'activo');
    check('sin ejercicio = sedentaria', C.suggestActivity({ exerciseDays: 0 }) === 'sedentario');

    // almacenamiento
    const m = S.migrate({ weights: [{ date: '2026-09-01', kg: '90.5' }, { date: 'mal', kg: 3 }, { date: '2026-09-02', kg: 0 }], extra: 'se queda' });
    check('migrar limpia pesadas inválidas y convierte a número', m.weights.length === 1 && m.weights[0].kg === 90.5);
    check('migrar no pierde campos desconocidos', m.extra === 'se queda');
    let threw = false;
    try { S.parseBackup('{"hola":1}'); } catch { threw = true; }
    check('una copia ajena se rechaza', threw);
    const round = S.parseBackup(S.exportText({ ...S.emptyState(), weights: [{ date: '2026-09-01', kg: 90 }] }));
    check('copia de ida y vuelta', round.weights.length === 1 && round.weights[0].kg === 90);
    threw = false;
    try { S.parseBackup(JSON.stringify({ app: 'Trampantojo', schema: 99, data: {} })); } catch { threw = true; }
    check('una copia de una versión más nueva se rechaza', threw);

    // resumen y mensaje
    const profile = { name: 'Francis Martínez', sex: 'h', birthDate: '1980-05-10', heightCm: 180, goalKg: 82, rateKgWeek: 0.5, activity: 'ligero' };
    const st = { ...S.emptyState(), profile, weights: days('2026-08-20', 34, i => 95 - 0.08 * i + (i % 3 ? 0.3 : -0.3)) };
    const s = C.summarize(st, '2026-09-22');
    check('resumen: IMC, objetivo, ritmo y proyección presentes', s.bmi > 0 && s.target.kcal > 0 && s.rate && s.projection?.status, JSON.stringify({ bmi: s.bmi, rate: s.rate, pr: s.projection }));
    check('resumen: la tendencia está entre el inicio y el último peso', s.trendKg < s.startKg && s.trendKg > 91, s.trendKg);
    const msg = messageOfTheDay(s, profile, new Date(2026, 8, 22, 9));
    check('mensaje del día con título y texto', !!(msg?.title && msg?.text), JSON.stringify(msg));
    const msg0 = messageOfTheDay(C.summarize({ ...S.emptyState(), profile }, '2026-09-22'), profile);
    check('mensaje sin datos = empezar', msg0.title === 'Empieza hoy');

    document.getElementById('sum').textContent = fail ? `✗ ${fail} fallan de ${pass + fail}` : `✓ ${pass} de ${pass} bien`;
    document.getElementById('sum').className = fail ? 'ko' : 'ok';
    document.title = fail ? `FALLAN ${fail}` : `OK ${pass}`;
  </script>
</body>
</html>
