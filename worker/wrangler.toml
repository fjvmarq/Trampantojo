# Trampantojo · el servidor de los avisos de agua.
# Se publica con tools/worker-deploy.py (API de Cloudflare, sin instalar nada);
# este fichero sirve igual si algún día se usa «wrangler deploy».
name = "trampantojo-agua"
main = "agua.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "AGUA"
# id = "<lo rellena el despliegue>"

[triggers]
crons = ["*/15 * * * *"]

# secretos (wrangler secret put): VAPID_PRIVATE_JWK
# variables: VAPID_PUBLIC
